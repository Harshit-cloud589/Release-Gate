name: TDS GA7 Release Gate

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: none

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: "TDS identity: 24f3001108@ds.study.iitm.ac.in"
        run: echo "TDS identity: 24f3001108@ds.study.iitm.ac.in"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test release gate
        run: |
          python - <<'PY'
          from app import evaluate_release_gate

          safe_payload = {
              "target": "preview",
              "event": "pull_request",
              "ref": "refs/heads/test",

              "workflow": {
                  "trigger": "pull_request",

                  "permissions": {
                      "contents": "read",
                      "packages": "write",
                      "id-token": "none"
                  },

                  "testsPassed": True,
                  "matrixComplete": True,
                  "failFast": False,

                  "actions": [
                      {
                          "owner": "actions",
                          "name": "checkout",
                          "ref": "v4"
                      },
                      {
                          "owner": "example",
                          "name": "test",
                          "ref": "0123456789abcdef0123456789abcdef01234567"
                      }
                  ]
              },

              "image": {
                  "multiStage": True,
                  "runsAsRoot": False,
                  "secretMode": "none",
                  "criticalVulnerabilities": 0,
                  "digestPinned": True
              }
          }

          result = evaluate_release_gate(safe_payload)

          print(result)

          assert result["decision"] == "promote"
          assert result["violations"] == []

          print("Release gate test passed!")
          PY
